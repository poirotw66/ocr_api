name: Public repository identity guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for company account identifiers and embedded credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "corporate_email": re.compile(r"(?i)[\w.+-]+@[\w.-]*holdings\.com\.tw"),
              "organization_tenant": re.compile(r"(?i)[\w.+-]+@[\w.-]+\.onmicrosoft\.com"),
              "employee_workstation": re.compile(r"(?i)(?:/Users/|/home/)[cC][fF][hH]\d{6,}"),
              "github_token": re.compile(r"(?:ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})"),
              "openai_key": re.compile(r"sk-proj-[A-Za-z0-9_-]{30,}"),
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }
          message_labels = ("corporate_email", "organization_tenant")

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          findings = []
          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode("utf-8", "surrogateescape"))
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(content):
                      findings.append(f"{path}: {label}")

          def commit_exists(sha: str) -> bool:
              if not sha or re.fullmatch(r"0+", sha):
                  return False
              return subprocess.call(
                  ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ) == 0

          event_name = os.environ.get("EVENT_NAME", "")
          before = os.environ.get("EVENT_BEFORE", "").strip()
          base_sha = os.environ.get("BASE_SHA", "").strip()

          if event_name == "pull_request" and commit_exists(base_sha):
              rev_range = [f"{base_sha}..HEAD"]
          elif event_name == "push" and commit_exists(before):
              rev_range = [f"{before}..HEAD"]
          else:
              rev_range = ["-1", "HEAD"]

          log_cmd = ["git", "log", *rev_range, "--format=%H%x00%B%x00"]
          log_output = subprocess.check_output(log_cmd)
          parts = log_output.split(b"\0")
          for index in range(0, len(parts) - 1, 2):
              sha = parts[index].decode("utf-8", "replace").strip().splitlines()
              if not sha:
                  continue
              commit_sha = sha[-1]
              message = parts[index + 1].decode("utf-8", "replace")
              for label in message_labels:
                  if patterns[label].search(message):
                      findings.append(f"commit {commit_sha[:12]} message: {label}")

          if findings:
              print("Potential sensitive identifiers detected (values hidden):")
              print("\n".join(findings))
              sys.exit(1)
          print("No configured identifier patterns detected.")
          PY
